<title>語彙数チェッカー</title>

/* VOICE: 落ち着いた辞書の索引。静かで正確。

   PICTURE: 大きな見出し語と4つの選択肢のカード（操作するものそのもの）。
   COLOUR and TYPE: 白い紙・墨・朱。見出し語は明朝、UIはゴシック。
   LAYOUT: 細いタイトル → タブ → 問題カード（進捗つき） → 結果と復習リスト。 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#131211);--ink:light-dark(#1b1a19,#ecebe8);--sub:light-dark(#6b6762,#a29d97);--line:light-dark(#e3e0dc,#2c2a28);--card:light-dark(#faf9f7,#1c1b1a);--shu:light-dark(#c8321f,#ff6b55);--shu-bg:light-dark(#fbe9e6,#3a1d18);--ok:light-dark(#1f6f4a,#5fd39a);--ok-bg:light-dark(#e5f3ec,#173226)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 60px}
h1{font:700 clamp(26px,4.4vw,36px)/1.1 "Shippori Mincho",serif;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--sub);margin:0 0 18px;font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tabs button,.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:clamp(18px,4vw,30px)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--line);border-radius:3px;margin:6px 0 22px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--shu);transition:width .2s}
.word{font:700 clamp(40px,9vw,60px)/1.1 "Shippori Mincho",serif;text-align:center;margin:8px 0 26px;overflow-wrap:anywhere}
.en .word{font-size:clamp(32px,7vw,46px)}
.q{font-size:14px;color:var(--sub);text-align:center;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:52px;padding:10px 16px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:16px}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.ng{border-color:var(--shu);background:var(--shu-bg);color:var(--shu)}
.idk{margin-top:12px;width:100%;min-height:46px;border:1px dashed var(--sub);background:transparent;border-radius:10px;color:var(--sub)}
.start{text-align:center}
.start p{margin:0 0 18px}
.go{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700;min-width:12em}
.big{font:700 clamp(44px,10vw,72px)/1 "Shippori Mincho",serif;color:var(--shu);white-space:nowrap;margin:6px 0 4px}
.big small{font-size:.36em;color:var(--ink);margin-left:6px}
.lvl{font-size:17px;margin:6px 0 0}
.lvl b{font-size:20px}
.rows{margin-top:22px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:2.6em 10em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px}
.row .t{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.row .f{height:100%;background:var(--shu);border-radius:6px}
.row .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .lv{font-weight:700;font-variant-numeric:tabular-nums}
.row .lb{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font:700 20px/1.3 "Shippori Mincho",serif;margin:30px 0 10px}
.rev{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rev li{display:grid;grid-template-columns:9em minmax(0,1fr) 3.2em;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:baseline}
.rev b{font-family:"Shippori Mincho",serif;font-size:18px;overflow-wrap:anywhere}
.rev i{font-style:normal;color:var(--sub);font-size:13px;text-align:right;white-space:nowrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.note{font-size:13px;color:var(--sub);margin-top:22px}
@media(max-width:600px){.row{grid-template-columns:2.4em 6.5em minmax(0,1fr) 2.8em}.rev li{grid-template-columns:6.5em minmax(0,1fr) 3em}}
@media(prefers-reduced-motion:reduce){.pbar i{transition:none}}
</style>
</head>

  <div class="card" id="card" aria-live="polite"></div>

   ["truculent","喧嘩腰の",9,"a"],["lugubrious","陰気な",9,"a"],["recalcitrant","反抗的な",9,"a"],["pellucid","澄みきった",9,"a"],["lachrymose","涙もろい",9,"a"],
   ["crepuscular","薄明の",10,"a"],["susurrus","ささやき声",10,"n"],["tergiversate","言い逃れをする",10,"v"],["otiose","無用な",10,"a"],["hebetude","愚鈍",10,"n"]]}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const maxL=l=>T[l].levels.length-1;
/* そのレベルの語を知っている確率 */
const pk=(th,L)=>1/(1+Math.exp(-1.6*(th-L)));
let lang="ja",used,ans,cur,busy=false,theta;

function estimate(){
 const M=maxL(lang),mu=T[lang].start+1;let best=mu,bl=-1e9;
 for(let th=0;th<=M+1.5;th+=0.05){
  let ll=-((th-mu)**2)/(2*16);
  for(const a of ans){const k=pk(th,a.q[2]);
   const p=a.r==="ok"?k+(1-k)/4:a.r==="ng"?(1-k)*0.75:(1-k)*0.9+0.1*k;
   ll+=Math.log(Math.max(p,1e-9))}
  if(ll>bl){bl=ll;best=th}}
 return best;
}
function nextQ(){
 const pool=T[lang].w.filter(x=>!used.has(x[0]));
 let target=ans.length===0?T[lang].start:theta+(ans.at(-1).r==="ok"?0.4:-0.4);
 target=Math.max(1,Math.min(maxL(lang),target));
 const d=Math.min(...pool.map(x=>Math.abs(x[2]-target)));
 const near=pool.filter(x=>Math.abs(x[2]-target)<=d+0.5);
 return near[Math.floor(Math.random()*near.length)];
}
function options(q){
 const all=T[lang].w.filter(x=>x[0]!==q[0]&&x[1]!==q[1]&&(x[3]||"")===(q[3]||""));
 let pool=all.filter(x=>Math.abs(x[2]-q[2])<=1);
 if(pool.length<3)pool=all.filter(x=>Math.abs(x[2]-q[2])<=3);
 if(pool.length<3)pool=all;
 return shuffle([q[1],...shuffle(pool).slice(0,3).map(x=>x[1])]);
}
function intro(){
 const d=T[lang];$("card").className="card "+lang;
 $("card").innerHTML=`<div class="start"><p>${d.name}・全${N}問（約3分）<br>レベル1〜${maxL(lang)}</p><button class="btn go" id="begin">はじめる</button></div>`;
 $("begin").onclick=begin;
}
function begin(){used=new Set();ans=[];theta=T[lang].start;show()}
function show(){
 const d=T[lang];busy=false;const q=nextQ();used.add(q[0]);const opts=options(q);cur={q,opts};
 $("card").className="card "+lang;
 $("card").innerHTML=`<div class="prog"><span>${ans.length+1} / ${N}</span><span>${d.name}</span></div>
 <div class="pbar"><i style="width:${ans.length/N*100}%"></i></div>
 <div class="word" lang="${lang}">${esc(q[0])}</div><div class="q">${d.q}</div>
 <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
 <button class="idk" id="idk">わからない</button>`;
 $("card").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(opts[+b.dataset.k],b));
 $("idk").onclick=()=>pick(null,null);
}
function pick(o,btn){
 if(busy)return;busy=true;
 const {q,opts}=cur,r=o===null?"idk":(o===q[1]?"ok":"ng");ans.push({q,r});theta=estimate();
 $("card").querySelectorAll(".opt").forEach(b=>{if(opts[+b.dataset.k]===q[1])b.classList.add("ok")});
 if(btn&&r==="ng")btn.classList.add("ng");
 setTimeout(()=>{ans.length<N?show():result()},r==="ok"?350:900);
}
function result(){
 const d=T[lang],M=maxL(lang);let total=0;
 for(let L=1;L<=M;L++)total+=d.levels[L][1]*pk(theta,L);
 const step=lang==="ja"?1000:100,est=Math.round(total/step)*step;
 const lv=Math.max(1,Math.min(M,theta)),li=Math.max(1,Math.min(M,Math.floor(lv+0.5)));
 const rows=[];for(let L=1;L<=M;L++){const a=ans.filter(x=>x.q[2]===L);
  rows.push(`<div class="row"><span class="lv">Lv${L}</span><span class="lb">${d.levels[L][0]}</span><div class="t"><div class="f" style="width:${Math.round(pk(theta,L)*100)}%"></div></div><span class="n">${a.length?a.filter(x=>x.r==="ok").length+"/"+a.length:"–"}</span></div>`)}
 const miss=ans.filter(x=>x.r!=="ok").sort((a,b)=>a.q[2]-b.q[2]);
 $("card").innerHTML=`<div>推定語彙数（${d.name}）</div>
 <div class="big">${est.toLocaleString()}<small>${d.unit}</small></div>
 <p class="lvl">レベル <b>${lv.toFixed(1)}</b>　${d.levels[li][0]}相当</p>
 <div class="rows">${rows.join("")}</div>
 <p class="note">棒の長さは、そのレベルの語を知っていると推定される割合です。右の数字は実際の正答数です。当てずっぽうで正解する確率（4分の1）を考慮して推定しています。</p>
 ${miss.length?`<h2>覚えておきたい語</h2><ul class="rev">${miss.map(x=>`<li><b lang="${lang}">${esc(x.q[0])}</b><span>${esc(x.q[1])}</span><i>Lv${x.q[2]}</i></li>`).join("")}</ul>`:""}
 <div class="acts"><button class="btn go" id="again">もう一度</button><button class="btn" id="other">${lang==="ja"?"English版へ":"日本語版へ"}</button></div>`;
 $("again").onclick=begin;
 $("other").onclick=()=>setLang(lang==="ja"?"en":"ja");
 $("card").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});
}
function setLang(l){lang=l;$("t-ja").setAttribute("aria-selected",l==="ja");$("t-en").setAttribute("aria-selected",l==="en");intro()}
$("t-ja").onclick=()=>setLang("ja");$("t-en").onclick=()=>setLang("en");
document.addEventListener("keydown",e=>{const n="1234".indexOf(e.key);const b=$("card").querySelectorAll(".opt");if(n>=0&&b[n])b[n].click();if(e.key==="0"&&$("idk"))$("idk").click()});
intro();
}
</script>
</body>
</html>
