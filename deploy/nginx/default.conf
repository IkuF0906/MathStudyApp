# Cloudflare Tunnel（cloudflared）経由のときは、Cloudflare が付ける CF-Connecting-IP を本当の送信元とする。
# 信用するのは Docker のネットワーク内から来たときだけ
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# cloudflared が付ける X-Forwarded-Proto（https）を引き継ぐ。なければ nginx に来たときの方式
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 1つの IP から送れる回数を制限する。
# 答え合わせ（解答・読み取りの確認）は SymPy で計算するので重く、ワーカーは2つしかない。
# 1人で埋めてしまわないよう、回数を絞ったうえで、同時に計算させられる数も IP ごとに抑える
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=grade:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=preview:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=start:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=compute:10m;
limit_req_status 429;
limit_conn_status 429;

upstream app {
    server app:8000;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 画面は nginx が直接返す。更新がすぐ反映されるよう、毎回変更を確かめさせる
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # /api/ への転送の設定（下の location が引き継ぐ）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app;
    }

    # 解答の送信（練習・レベル診断）。人が解くなら数秒に1回なので、1分に30回までで足りる
    location ~ ^/api/(answer|placement/answer)$ {
        limit_req zone=grade burst=10 nodelay;
        limit_conn compute 1;
        # 送った直後に接続を切っても、計算が終わるまで同時の数を戻さない（アプリでも数えている）
        proxy_ignore_client_abort on;
        proxy_pass http://app;
    }

    # テキスト入力で、入力中の式の読み取りを確かめる（打つのを止めて 0.3 秒後に1回）
    location = /api/preview {
        limit_req zone=preview burst=10 nodelay;
        limit_conn compute 1;
        # 送った直後に接続を切っても、計算が終わるまで同時の数を戻さない（アプリでも数えている）
        proxy_ignore_client_abort on;
        proxy_pass http://app;
    }

    # レベル診断を始める（始めるたびに DB に記録ができる）
    location = /api/placement/start {
        limit_req zone=start burst=5 nodelay;
        proxy_pass http://app;
    }
}
